<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">PhotoFrame result examples</title>
  <desc id="desc">The same illustrated landscape in film strip, Instax, and clean bottom-band frames.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b8bd"/>
      <stop offset="1" stop-color="#e9d3aa"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#495b45"/>
      <stop offset="1" stop-color="#1f2820"/>
    </linearGradient>
    <symbol id="photo" viewBox="0 0 240 330">
      <rect width="240" height="330" fill="url(#sky)"/>
      <circle cx="176" cy="72" r="27" fill="#f3d489" opacity=".9"/>
      <path d="M0 220 58 145 113 218 160 167 240 244V330H0Z" fill="#71806c"/>
      <path d="M0 258 72 198 125 260 185 205 240 250V330H0Z" fill="url(#hill)"/>
      <path d="M120 330c-8-70 5-125 47-164-29 51-27 106-17 164Z" fill="#d7c49c" opacity=".72"/>
    </symbol>
  </defs>

  <rect width="1200" height="700" fill="#14130f"/>
  <text x="600" y="46" fill="#efeae0" font-family="system-ui, sans-serif" font-size="18" font-weight="650" text-anchor="middle" letter-spacing="5">ONE PHOTO · THREE FRAMES</text>
  <text x="600" y="72" fill="#918a7c" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">FILM STRIP · INSTAX · CLEAN BAND</text>

  <g transform="translate(65 105)">
    <rect width="310" height="525" rx="2" fill="#0d0c0a"/>
    <g fill="#c9b98e" opacity=".72">
      <rect x="12" y="20" width="20" height="34" rx="4"/><rect x="12" y="72" width="20" height="34" rx="4"/><rect x="12" y="124" width="20" height="34" rx="4"/><rect x="12" y="176" width="20" height="34" rx="4"/><rect x="12" y="228" width="20" height="34" rx="4"/><rect x="12" y="280" width="20" height="34" rx="4"/><rect x="12" y="332" width="20" height="34" rx="4"/><rect x="12" y="384" width="20" height="34" rx="4"/>
      <rect x="278" y="20" width="20" height="34" rx="4"/><rect x="278" y="72" width="20" height="34" rx="4"/><rect x="278" y="124" width="20" height="34" rx="4"/><rect x="278" y="176" width="20" height="34" rx="4"/><rect x="278" y="228" width="20" height="34" rx="4"/><rect x="278" y="280" width="20" height="34" rx="4"/><rect x="278" y="332" width="20" height="34" rx="4"/><rect x="278" y="384" width="20" height="34" rx="4"/>
    </g>
    <use href="#photo" x="44" y="28" width="222" height="374"/>
    <text x="44" y="437" fill="#efeae0" font-family="ui-monospace, monospace" font-size="12">NIKON F5</text>
    <text x="44" y="458" fill="#a9a297" font-family="ui-monospace, monospace" font-size="10">AF-D 35MM F2 · PORTRA 400</text>
    <text x="44" y="482" fill="#e8873a" font-family="ui-monospace, monospace" font-size="10">2026.07.20</text>
  </g>

  <g transform="translate(445 105)">
    <rect width="310" height="525" rx="3" fill="#ffffff"/>
    <use href="#photo" x="20" y="20" width="270" height="372" preserveAspectRatio="xMidYMid slice"/>
    <text x="26" y="432" fill="#2a2723" font-family="system-ui, sans-serif" font-size="16" font-weight="650">Nikon F5</text>
    <text x="26" y="454" fill="#6b655d" font-family="system-ui, sans-serif" font-size="11">AF-D 35mm f/2 · Portra 400</text>
    <text x="26" y="483" fill="#8a8378" font-family="Georgia, serif" font-size="13" font-style="italic">summer road, 2026</text>
  </g>

  <g transform="translate(825 105)">
    <rect width="310" height="525" rx="2" fill="#f6f3ec"/>
    <use href="#photo" x="14" y="14" width="282" height="388" preserveAspectRatio="xMidYMid slice"/>
    <text x="20" y="440" fill="#2a2723" font-family="system-ui, sans-serif" font-size="15" font-weight="650">Nikon F5</text>
    <text x="20" y="463" fill="#625d55" font-family="ui-monospace, monospace" font-size="10">35MM · F2 · 1/500S · ISO 400</text>
    <text x="290" y="493" fill="#b2a99d" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">2026.07.20</text>
  </g>
</svg>
